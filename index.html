<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Consortium | SA-Analytical</title>
  <meta name="description" content="The Consortium: SA-Analytical's humanitarian and development page.">
  <style>
    :root {
      --bg-anthracite: #1f1f1f;
      --text-white: #ffffff;
      --text-soft: #f2f2f2;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background-color: var(--bg-anthracite, #222222);
      color: var(--text-white);
      font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      width: 100%;
      max-width: 720px;
      text-align: center;
      animation: fade-in 0.9s ease-out both;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 4.25rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1.15;
      color: var(--text-white);
    }

    .rule {
      display: block;
      width: 56px;
      height: 1px;
      margin: 32px auto;
      background-color: var(--text-white);
      opacity: 0.7;
    }

    p {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      font-weight: 300;
      letter-spacing: 0.01em;
      color: var(--text-soft);
      max-width: 560px;
      margin: 0 auto;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>The Consortium</h1>
    <span class="rule" aria-hidden="true"></span>
    <p>You have arrived in our humanitarian and development page. The page is under construction. Stay tuned for future posts...</p>
  </main>
</body>
</html>
